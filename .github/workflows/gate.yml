# 主项目 CI：为每次合并进 main 留下机器产生的测试记录。
# 定位：记录与信号。权威门禁仍是生产服务器 bash scripts/gate.sh（开发/测试分离规则不变，本文件不改 gate.sh）。
# 2026-10-24 起 gate.sh **分层**：母项目用例（排除 paper_trading/）= 权威、必须全绿；
# vendor 用例单独跑并记录、域内失败不阻塞（协议 §6）。故本 CI 现在只对"母项目用例"作通过/失败判定，
# vendor 域内失败不再让 CI 变红（子方 Issue 流程负责）。
# 本仓工作流为本地 ff 合并后直推 main：push 触发 = 每次合并的机器记录（事后）；
# "合并前"的机器验证由生产 worktree gate 承担（合并惯例，非 CI）；
# pull_request 触发仅在出现真实 PR（外部贡献）时激活。无矩阵、无发布流水线、无打包。
name: gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 对齐生产时区（HKT=UTC+8），防时间敏感测试在 UTC 机器上漂移
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖（与生产 venv 同为 editable 安装）
        run: pip install -e . pytest

      - name: 全仓门禁
        run: bash scripts/gate.sh
