{# AI 观察池：与候选卡同一模板（2026-10-26），不再单独一套 .wl-item 结构。 #}
{% if watchlist %}
{% set _view = view if view is defined else 'pool' %}
<div class="stock-list">
{% for stock in watchlist %}
{% set view = _view %}
{% include '_stock_card.html' %}
{% endfor %}
</div>
{% else %}
<div class="empty-state">
    <div class="icon">&#9678;</div>
    <h2>观察池为空</h2>
    <p>周六 00:00 AI 自动复盘后，将在此处展示 5 只观察股。</p>
</div>
{% endif %}
