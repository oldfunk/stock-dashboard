<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟交易 - {{ page_title }}</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1c1e;
            --text-secondary: #5f6368;
            --accent: #1a73e8;
            --divider: #e0e3e7;
            --radius: 8px;
            --font-sans: 'Noto Sans SC', -apple-system, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--divider); }
        .header h1 { font-size: 18px; margin: 0; }
        .nav-link { color: var(--accent); text-decoration: none; font-size: 14px; margin-left: 16px; }
        .wrap { max-width: 1440px; margin: 0 auto; padding: 16px 20px; }
        .note { font-size: 13px; color: var(--text-secondary); margin: 0 0 10px 0; }
        .note .mono { font-family: var(--font-mono); font-size: 12px; }
        iframe.sub { width: 100%; height: 82vh; border: 1px solid var(--divider); border-radius: var(--radius); background: #fff; }
    </style>
</head>
<body>
    <header class="header">
        <h1>模拟交易</h1>
        <div>
            <a href="/" class="nav-link">首页</a>
            <a href="/llm" class="nav-link">模型设置</a>
        </div>
    </header>
    <div class="wrap">
        <p class="note" id="paperNote">加载子项目原面板…（与本面板同机不同端口；<span class="mono">:8080</span> 为子项目独立部署，互不干扰）</p>
        <iframe class="sub" id="paperFrame" title="模拟交易仪表盘"></iframe>
    </div>

<script>
(function () {
    var host = location.hostname || '127.0.0.1';
    var url = 'http://' + host + ':8081/';
    document.getElementById('paperFrame').src = url;
    document.getElementById('paperNote').innerHTML =
        '子项目原面板（merged tree <span class="mono">paper_trading/</span>，数据与 AI 挂母项目）直嵌如下，打不开请确认 8081 服务；' +
        '<a href="' + url + '" target="_blank" rel="noopener">新窗口打开</a>；' +
        '另有子项目独立部署 <span class="mono">:8080</span>（自有策略池与账本，互不干扰）。';
})();
</script>
</body>
</html>
