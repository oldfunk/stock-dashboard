<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模拟交易 - {{ page_title }}</title>
    <style>
        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --text-primary: #1a1c1e;
            --text-secondary: #5f6368;
            --accent: #1a73e8;
            --divider: #e0e3e7;
            --radius: 8px;
            --font-sans: 'Noto Sans SC', -apple-system, 'Segoe UI', sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', monospace;
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); }
        .header { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; background: var(--bg-secondary); border-bottom: 1px solid var(--divider); }
        .header h1 { font-size: 18px; margin: 0; }
        .nav-link { color: var(--accent); text-decoration: none; font-size: 14px; margin-left: 16px; }
        .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px; text-align: center; }
        .note { font-size: 14px; color: var(--text-secondary); }
        .note .mono { font-family: var(--font-mono); font-size: 12px; }
        .open-link { display: inline-block; margin-top: 12px; font-size: 15px; color: #fff; background: var(--accent); border-radius: var(--radius); padding: 9px 26px; text-decoration: none; }
    </style>
</head>
<body>
    <header class="header">
        <h1>模拟交易</h1>
        <div>
            <a href="/" class="nav-link">首页</a>
            <a href="/llm" class="nav-link">模型设置</a>
        </div>
    </header>
    <div class="wrap">
        <p class="note" id="msg">正在打开模拟交易仪表盘…（子项目原面板，直连 <span class="mono">:8081</span>）</p>
        <p><a class="open-link" id="openLink" href="#">打不开？点这里手动打开</a></p>
        <p class="note">另有子项目独立部署 <span class="mono">:8080</span>（自有策略池与账本，互不干扰）。</p>
    </div>

<script>
(function () {
    var url = 'http://' + (location.hostname || '127.0.0.1') + ':8081/';
    var link = document.getElementById('openLink');
    link.href = url;
    link.target = '_blank';
    link.rel = 'noopener';
    window.location.replace(url);
})();
</script>
</body>
</html>
