# 股票盯盘看板配置文件
# 复制为 local.yaml 覆盖默认值（local.yaml 已被 .gitignore 排除）

# -------- 数据源配置 --------
data_source:
  market: "A"              # A: A股, 未来扩展: HK, US
  cache_days: 1            # 缓存有效期（天），1 表示每日刷新

# -------- 量化筛选条件 (价值投资) --------
screener:
  # 格雷厄姆/巴菲特风格价值投资过滤
  # A 股适配版——可根据市场情况调整
  conditions:
    max_pe: 20              # 市盈率上限（TTM）
    min_pe: 3               # 市盈率下限（排除亏损和微利股）
    max_pb: 3.5             # 市净率上限
    min_roe: 5              # ROE 下限（%）— 东财加权ROE(ROEJQ)比新浪保守，5%已能筛出优质股
    min_revenue_growth: 0   # 营收增长率下限（%）— 允许稳定不增长的价值股
    min_profit_growth: 0    # 净利润增长率下限（%）— 允许稳定型价值股
    max_debt_ratio: 65      # 资产负债率上限（%）
    min_market_cap: 30      # 最低流通市值（亿）
    max_market_cap: 50000   # 最高市值（亿）
    min_dividend_yield: 0   # 股息率下限（%），0=不要求

  # 额外过滤
  exclude_st: true          # 排除 ST/*ST 股票
  exclude_new_stocks: 60    # 上市不足 N 天的次新股排除
  max_candidates: 20        # 最大候选股票数量

  # ── 新增：毛利率与现金流阈值（对应东财指标 XSMLL / MGJYXJJE）──
  # 毛利率下限：低于此值且ROE<20%时排除（允许薄利多销）
  min_gross_margin: 15
  # 经营现金流/股下限：≤0且毛利率<30%+增长<20%时排除（允许高增长投入期）
  min_ocf_per_share: 0
  # 净利率 < 5%且毛利率<30%时排除（AI Berkshire规则6）
  min_net_margin: 5
  # ── 新增：利息覆盖倍数 — AI Berkshire规则3
  min_interest_coverage: 2
  # ── 新增：5年累计FCF — AI Berkshire规则2
  min_fcf_5y: 0
  # ── 新增：股本稀释上限 — AI Berkshire规则7
  max_share_dilution: 20

  # ── 多策略开关（M2收尾，默认 false）──
  # true 时 orchestrator 走 config/strategies.yaml 三池（成长/红利/困境反转）
  # 并集持久化；false 保持原有单策略行为不变
  multi_strategy: false

# -------- AI 分析配置 --------
ai:
  # LLM API 配置 (OpenAI 兼容)
  provider: "opencode-zen"           # OpenCode Zen
  api_base: "https://opencode.ai/zen/v1"
  model: "deepseek-v4-flash-free"   # 默认模型（自动发现+故障轮换，详见 ai_analyzer.FreeModelPool）
  temperature: 0.3
  max_tokens: 6000
  # 免 Key 备用通道：主池全灭时每只股票兜底（默认 Pollinations，可配其它 OpenAI 兼容源）
  fallback:
    enabled: true
    api_base: "https://text.pollinations.ai/openai"
    model: "openai-fast"
    temperature: 0.3
    max_tokens: 6000
    retries: 2

# -------- Hermes 代理 AI 分析（通用，任何 Hermes 实例可接入） --------
# 主通道：付费 API（OpenRouter 等），优先使用
# 降级通道：免费 API（Pollinations 等），主通道失败时兜底
# api_key 不存 Git，在 .env 或本地配置中设置
hermes_proxy:
  primary:
    api_base: "https://openrouter.ai/api/v1"
    model: "anthropic/claude-sonnet-5"
    api_key: null
    timeout: 300
  fallback:
    api_base: "https://text.pollinations.ai/openai"
    model: "openai-fast"
    api_key: null
    timeout: 300
    retries: 2

# -------- Web 服务配置 --------
web:
  host: "0.0.0.0"
  port: 9527
  refresh_interval: 60      # 前端自动刷新秒数
  page_title: "价值投资选股看板"

# -------- 定时任务配置 --------
schedule:
  # A 股交易时间：周一至周五 9:30-15:00
  # 每日收盘后运行（15:30 后数据基本更新完毕）
  daily_update_time: "15:30"
  # 大盘数据更新间隔（分钟）
  market_index_interval: 30

# -------- 纸盘交易配置（M4a） --------
paper:
  initial_cash: 1000000            # 初始资金（默认 100 万）
  slippage_pct: 0.1                # 滑点百分比（默认 0.1%）
  commission_rate: 0.00025         # 佣金费率（万 2.5）
  commission_min: 5.0              # 佣金最低（元）
  stamp_tax_rate: 0.005            # 印花税率（卖出千分之 0.5）
  transfer_fee_rate: 0.00001       # 过户费率（万 0.1）
  max_position_pct: 20             # 单股最大仓位占比（%）
  max_total_position_pct: 80       # 最大总仓位占比（%）
  force_stop_loss_pct: -7          # 个股浮亏强制离场阈值（%）
  force_drawdown_pct: -15          # 账户回撤禁买阈值（%）

# -------- AI 观察池复盘配置 --------
ai_review:
  enabled: true                    # 是否启用周六 AI 复盘
  candidate_pool_weeks: 4          # 候选池回看周数（从 screening_result 取）
  watchlist_size: 5                # 观察池固定容量
  hard_rules:
    signal_avoid: true             # Signal=AVOID 强制调出
    roe_below: 5                   # ROE 低于此值强制调出
    price_above_buyzone_pct: 20    # 越出买入区上限百分比
    roe_collapse_pp: 10            # ROE 同比下降 pp
    veto_triggered: true            # AI 快速否决红线（一票否决）触发强制调出
    argument_drift: true            # 论点漂移（入池理由正面词 + AVOID）强制调出
