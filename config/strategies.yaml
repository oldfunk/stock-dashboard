# 多策略配置文件
# 用于定义成长/红利/困境反转策略的阈值配置
# 当前为占位结构，后续将接入流水线

growth:
  name: "成长策略"
  description: "era-alpha 高增长主线：定价权+壁垒+增长质量三标准，持有到拐点"
  alpha_criteria:
    pricing_power:
      gross_margin_min: 0.30
      margin_vs_5y_avg: "ge"
    moat:
      roe_avg_5y_min: 0.15
      roe_volatility_max: 10.0
    growth_quality:
      revenue_growth_min: 0.0
      profit_growth_min: 0.0
      ocf_per_share_min: 0.0
      growth_rate_avg_3y_min: 0.20
  thresholds:
    roe_avg_5y_min: 0.15
    pe_max: 25.0
    pe_ttm_max: 30.0
    gross_margin_min: 0.30
    net_margin_min: 0.10
    debt_ratio_max: 0.50
    fcf_yield_min: 0.03
  valuation_anchor:
    bubble_pe: 40.0
    buy_zone: "合理或低估时重仓"
  exit_triggers:
    - "毛利率连续2年下滑"
    - "OCF转负"
    - "ROE跌破12%"
    - "PE超历史均值3σ（待历史PE落库后启用）"

dividend:
  name: "红利策略"
  description: "高股息、低估值、稳定现金流"
  thresholds:
    roe_avg_5y_min: 0.08   # 5年平均ROE >= 8%
    pe_max: 20.0          # 市盈率 <= 20
    pe_ttm_max: 22.0      # 市盈率TTM <= 22
    gross_margin_min: 0.15  # 毛利率 >= 15%
    net_margin_min: 0.05    # 净利率 >= 5%
    debt_ratio_max: 0.60    # 资产负债率 <= 60%
    dividend_yield_min: 0.04  # 股息率 >= 4%
    fcf_yield_min: 0.02     # FCF收益率 >= 2%
    payout_ratio_max: 0.70  # 分红率 <= 70%

turnaround:
  name: "困境反转策略"
  description: "短期困境、长期价值、估值低位"
  thresholds:
    roe_avg_5y_min: 0.05   # 5年平均ROE >= 5%（放宽）
    pe_max: 15.0          # 市盈率 <= 15（低估值）
    pe_ttm_max: 18.0      # 市盈率TTM <= 18
    gross_margin_min: 0.10  # 毛利率 >= 10%
    net_margin_min: 0.03    # 净利率 >= 3%
    debt_ratio_max: 0.70    # 资产负债率 <= 70%
    fcf_yield_min: 0.01     # FCF收益率 >= 1%
    debt_to_equity_max: 2.0  # 负债权益比 <= 2.0
    roe_volatility_max: 0.15  # ROE波动率 <= 15%（近期改善）
