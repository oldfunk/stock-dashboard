# 多策略阈值配置（M2 策略分化）
# 每个策略定义一组扁平阈值键，候选股命中阈值即加入该策略池。
# 阈值缺失的项跳过（不否决）：策略层叠加在 7 门基础质量之上。
#
# 可用阈值字段（与 value_screener._check_strategy_thresholds 对应）：
#   roe_avg_5y_min        — ROE 5 年均值下限（%）
#   pe_max / pe_ttm_max   — PE 上限
#   gross_margin_min      — 毛利率下限（%）
#   net_margin_min        — 净利率下限（%）
#   debt_ratio_max        — 负债率上限（%）
#   dividend_yield_min    — 股息率下限（%）
#   roe_volatility_max    — ROE 波动上限（%）
#   debt_to_equity_max    — 负债权益比上限
#   payout_ratio_max      — 分红率上限（%）
#   fcf_yield_min         — FCF 收益率下限（小数，如 0.05 = 5%）

growth:
  name: 成长型
  desc: 高营收/利润增长，容忍较高 PE，要求毛利率和 ROE 稳定
  roe_avg_5y_min: 15
  pe_max: 50
  pe_ttm_max: 60
  gross_margin_min: 25
  net_margin_min: 10
  debt_ratio_max: 60
  roe_volatility_max: 20
  fcf_yield_min: 0.03

dividend:
  name: 红利型
  desc: 高股息率，低负债，稳定 ROE，分红率适中
  roe_avg_5y_min: 12
  pe_max: 20
  pe_ttm_max: 22
  gross_margin_min: 15
  net_margin_min: 5
  debt_ratio_max: 50
  dividend_yield_min: 4
  roe_volatility_max: 10
  payout_ratio_max: 70
  fcf_yield_min: 0.02

turnaround:
  name: 困境反转
  desc: 低 PE/PB，ROE 从低谷回升，负债可控
  roe_avg_5y_min: 5
  pe_max: 15
  pe_ttm_max: 18
  gross_margin_min: 10
  net_margin_min: 3
  debt_ratio_max: 70
  fcf_yield_min: 0.01
  debt_to_equity_max: 2.0
  roe_volatility_max: 15
